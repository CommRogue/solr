title: Add an optional node-wide, segment-level Lucene query cache (LRUQueryCache), enabled
  in solr.xml via enableSegmentQueryCache and configured with segmentQueryCacheMaxRam
  (percentage of heap or absolute size) and segmentQueryCacheCount. Cached entries for unchanged
  segments survive commits without warm-up, complementing the per-core filterCache.
type: added
authors:
- name: Guy Stern
