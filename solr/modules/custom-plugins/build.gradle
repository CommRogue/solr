apply plugin: 'java-library'

description = 'Custom Solr plugins for this deployment'

dependencies {
  implementation platform(project(':platform'))
  implementation project(':solr:core')
  implementation project(':solr:solrj')

  // Used directly (Query, BooleanQuery, QueryBuilder, ...), so declared directly: solr-core exports
  // none of these to us, and analyzeClassesDependencies fails on an artifact used but not declared.
  implementation libs.apache.lucene.core

  // solr-core depends on all of these, but only as 'implementation', so they are not exported to us.
  // The index-analyzer reads codec metadata for legacy postings formats, and formats byte counts;
  // the top-keys cache is a fork of solr-core's own CaffeineCache, so it needs Caffeine itself.
  implementation libs.apache.lucene.backward.codecs
  implementation libs.commonsio.commonsio
  implementation libs.benmanes.caffeine

  // top-keys: slf4j for the logger, and dropwizard for Gauge -- SolrMetricsContext.gauge() takes
  // one, so registering the cache's MetricsMap references it from our bytecode.
  implementation libs.slf4j.api
  implementation libs.dropwizard.metrics.core

  // named-queries: the unified highlighter we subclass (UnifiedHighlighter, Passage,
  // DefaultPassageFormatter), and hppc for MatchedQueriesComponent's IntObjectHashMap.
  implementation libs.apache.lucene.highlighter
  implementation libs.carrotsearch.hppc

  // multi-analysis: UpdateRequestProcessor carries a @NotThreadSafe from jcip, so javac has to
  // resolve the annotation to subclass it. Compile-time only, exactly as solr-core declares it.
  compileOnly libs.stephenc.jcip.annotations

  compileOnly libs.projectlombok.lombok
  annotationProcessor libs.projectlombok.lombok

  testImplementation project(':solr:test-framework')
  testImplementation libs.apache.lucene.analysis.common

  // Both JUnit generations really are in use here, so both are declared: the plugin tests are JUnit 5,
  // while anything built on Solr's test framework (SolrTestCase, SolrTestCaseJ4) is JUnit 4. The
  // aggregate junit-jupiter artifact carries the api, params and engine; the vintage engine is what
  // lets the one Test task below run both generations.
  testImplementation libs.junit.junit
  testImplementation libs.junit.jupiter
  testRuntimeOnly libs.junit.vintage.engine
  // Gradle injects its own junit-platform-launcher when none is declared, which can be older than
  // the platform-engine the jupiter aggregate brings; unaligned versions fail engine discovery.
  testRuntimeOnly libs.junit.platform.launcher
}

// gradle/testing/defaults-tests.gradle pins every Test task to useJUnit(), which would ignore the
// vendored JUnit 5 tests entirely -- they would not run and not fail, just quietly disappear.
test {
  useJUnitPlatform()
}

// Annotation processing is disabled tree-wide in Solr via -proc:none (see gradle/java/javac.gradle),
// which would silently drop every Lombok-generated getter and constructor, so it is removed here.
// (On 9.x this block also raised --release from 11 to 17; Solr 10's floor is already 21, which the
// shipped Docker image satisfies, so the release override is gone.)
tasks.withType(JavaCompile).configureEach {
  options.compilerArgs -= ['-proc:none']
}

// The vendored tree is third-party code we do not reformat, re-license or document, and each of these
// checks fails on it for its own reason:
//
//  * rat        - the sources carry no ASF license header;
//  * ecjLint    - ECJ has no Lombok support, so it sees the un-generated sources and reports every
//                 call to a generated getter as an error;
//  * javadoc    - the vendored packages have no package-info.java, which the missing-doclet requires.
//                 Both render tasks are named here: RenderJavadocTask hardcodes
//                 '-subpackages org.apache.solr' (gradle/documentation/render-javadoc.gradle), and
//                 this module has nothing under that package, so javadoc exits non-zero regardless.
//
// None of them can be scoped to a subset of a source set, so they are switched off for this module.
tasks.matching {
  it.name == 'rat' || it.name.startsWith('ecjLint') || it.name in ['renderJavadoc', 'renderSiteJavadoc']
}.configureEach {
  enabled = false
}

// Spotless is the exception: it *can* be scoped, so only the vendored tree is held out (exactly as it
// already holds out org/apache/hadoop/** in the hdfs module) and anything we write stays formatted.
// Note this is scoped to the index-analyzer, not to org/commrogue/** as a whole: the rest of that
// namespace (org.commrogue.basicqparsers, ...) is code we own, and is formatted like anything else.
spotless {
  java {
    targetExclude 'src/**/org/commrogue/indexanalyzer/**'
  }
}

// (On 9.x this file also overrode solr.docker.baseImage to a Temurin 21 image; Solr 10's own
// default is eclipse-temurin:25-jre-noble, which is what this fork wants, so no override is needed.)

// Builds Solr from source (core modifications + this module), packages the full distribution,
// and tags a Docker image. Override the tag with -Psolr.docker.imageName=<repo>:<tag>.
tasks.register('dockerBuild') {
  group = 'Docker'
  description = 'Build a Solr Docker image from source, including this module'
  dependsOn ':solr:docker:docker'
}
